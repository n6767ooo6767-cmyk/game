<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Broken Graph</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header>
        <h1>Broken Graph</h1>
        <p>Formula → Graph</p>
    </header>


    <main id="game">

        <canvas id="graph"></canvas>


        <div id="controls">

            <input
                id="formula"
                type="text"
                value="sin(x)"
                placeholder="Например: sin(x)"
                autocomplete="off"
            >

            <button id="draw">
                Нарисовать
            </button>

        </div>


        <div id="error"></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
